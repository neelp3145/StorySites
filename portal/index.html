</head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand"><button class="mobilemenu" id="mobilemenu" aria-label="Toggle navigation">☰ Menu</button><div class="brandname">STORY<b>SITES</b><span style="font-size:11px;vertical-align:top;letter-spacing:0;margin-left:2px">™</span></div><div class="brandtag">Business Management</div></div><nav class="nav" id="nav" aria-label="Portal navigation"><button data-page="dashboard" class="active"><span class="ico">◫</span>Overview</button><button data-page="inquiries"><span class="ico">✉</span>Inquiries <small id="navinq">0</small></button><button data-page="customers"><span class="ico">♧</span>Customers</button><button data-page="projects"><span class="ico">▦</span>Projects</button><button data-page="invoices"><span class="ico">▤</span>Invoices</button><button data-page="hosting"><span class="ico">↻</span>Hosting & Renewals</button><button data-page="setup"><span class="ico">⚙</span>System Setup</button></nav><div class="sidebottom"><div class="profile"><div class="av">RF</div><div><strong>Portal Owner</strong><span>StorySites • Demo access</span></div></div></div></aside><main class="main"><header class="topbar"><span class="eyebrow">Private Management Portal <span style="color:#aab0b5">/ V1</span></span><div class="topright"><span class="pill">● Live Supabase mode</span><button class="topbtn" id="exportbtn">↓ Export data</button></div></header><div class="workspace"><div id="app"></div><div class="footer">STORYSITES™ MANAGEMENT PORTAL · VERSION 1 · ALL TABS CONNECTED TO SUPABASE · ADD AUTH BEFORE PRODUCTION</div></div></main></div><div class="modaloverlay" id="modaloverlay" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><form id="entryform"><div id="modalcontent"></div><div class="modalbuttons"><button type="button" class="btn" id="cancelmodal">Cancel</button><button type="submit" class="btn orange">Save record →</button></div></form></div></div <script>
(()=>{'use strict';
const KEY='storysites_portal_demo_v1';
const seed={inquiries:[{id:'I-1001',name:'Alex Morgan',email:'alex@example.com',service:'Executive StorySite',status:'New',date:'2026-11-10',notes:'Interested in a polished professional story.'},{id:'I-1002',name:'Jordan Lee',email:'jordan@example.com',service:'Personal StorySite',status:'Contacted',date:'2026-11-08',notes:'Wants to feature career milestones.'},{id:'I-1003',name:'Taylor Reed',email:'taylor@example.com',service:'Business StorySite',status:'Proposal Sent',date:'2026-11-05',notes:'Requested business showcase.'}],customers:[{id:'C-101',name:'Jamie Rivera',email:'jamie@example.com',service:'Executive StorySite',status:'Active',notes:'Demo record.'},{id:'C-102',name:'Morgan Chen',email:'morgan@example.com',service:'Personal StorySite',status:'Active',notes:'Demo record.'},{id:'C-103',name:'Casey Brooks',email:'casey@example.com',service:'Business StorySite',status:'Completed',notes:'Demo record.'}],projects:[{id:'P-201',name:'Jamie Rivera',service:'Executive StorySite',status:'In Development',due:'2026-11-22',notes:'Homepage narrative and career timeline.'},{id:'P-202',name:'Morgan Chen',service:'Personal StorySite',status:'Customer Review',due:'2026-11-18',notes:'Awaiting feedback on imagery.'},{id:'P-203',name:'Casey Brooks',service:'Business StorySite',status:'Completed',due:'2026-11-04',notes:'Site delivered.'}],invoices:[{id:'INV-301',name:'Jamie Rivera',amount:348.99,status:'Unpaid',due:'2026-11-20',notes:'Creation and first-year hosting.'},{id:'INV-302',name:'Morgan Chen',amount:249.99,status:'Paid',due:'2026-11-09',notes:'Creation.'},{id:'INV-303',name:'Casey Brooks',amount:348.99,status:'Paid',due:'2026-10-30',notes:'Creation and first-year hosting.'}],hosting:[{id:'H-401',name:'Casey Brooks',site:'example-storysite.netlify.app',renewal:'2027-01-15',status:'Active',notes:'Example URL only.'},{id:'H-402',name:'Morgan Chen',site:'demo-personal.netlify.app',renewal:'2027-03-01',status:'Active',notes:'Example URL only.'}],activity:[]};
const clone=x=>JSON.parse(JSON.stringify(x));
const apiBase=(typeof window.STORYSITES_API_BASE==='string'?window.STORYSITES_API_BASE:'').replace(/\/$/,'');
async function api(path, opts={}){
  const res=await fetch(apiBase+path,{...opts,headers:{'Accept':'application/json','Content-Type':'application/json',...(opts.headers||{})}});
  const body=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(body.message||('HTTP '+res.status));
  return body;
}
function mapInquiryFromApi(row){
  return {
    id:String(row.id),
    name:row.name||row.full_name||'',
    email:row.email||'',
    phone:row.phone||'',
    service:row.service||row.service_type||'',
    request_type:row.request_type||'',
    hosting:row.hosting||row.hosting_preference||'',
    status:row.status||'New',
    date:(row.date||row.created_at||'').toString().slice(0,10),
    notes:row.notes||row.project_details||'',
    source:'supabase'
  };
}
function mapCustomerFromApi(row){
  return {
    id:String(row.id),
    name:row.name||row.full_name||'',
    email:row.email||'',
    phone:row.phone||'',
    service:row.service||row.service_type||'',
    status:row.status||'Prospect',
    notes:row.notes||'',
    inquiry_id:row.inquiry_id||null,
    date:(row.date||row.created_at||'').toString().slice(0,10),
    source:'supabase'
  };
}
function mapProjectFromApi(row){
  return {id:String(row.id),name:row.name||'',service:row.service||'',status:row.status||'Not Started',due:row.due||'',notes:row.notes||'',source:'supabase'};
}
function mapInvoiceFromApi(row){
  return {id:String(row.id),name:row.name||'',amount:Number(row.amount)||0,status:row.status||'Draft',due:row.due||'',notes:row.notes||'',source:'supabase'};
}
function mapHostingFromApi(row){
  return {id:String(row.id),name:row.name||'',site:row.site||'',renewal:row.renewal||'',status:row.status||'Active',notes:row.notes||'',source:'supabase'};
}
const LIVE_TYPES={
  inquiries:{path:'/api/admin/inquiries',map:mapInquiryFromApi,key:'inquiries',singular:'inquiry'},
  customers:{path:'/api/admin/customers',map:mapCustomerFromApi,key:'customers',singular:'customer'},
  projects:{path:'/api/admin/projects',map:mapProjectFromApi,key:'projects',singular:'project'},
  invoices:{path:'/api/admin/invoices',map:mapInvoiceFromApi,key:'invoices',singular:'invoice'},
  hosting:{path:'/api/admin/hosting',map:mapHostingFromApi,key:'hosting',singular:'hosting'}
};
let data;try{const loaded=JSON.parse(localStorage.getItem(KEY));data=loaded&&Array.isArray(loaded.customers)&&Array.isArray(loaded.inquiries)?loaded:clone(seed)}catch(e){data=clone(seed)}
// All portal collections load from Supabase.
['inquiries','customers','projects','invoices','hosting'].forEach(k=>data[k]=[]);
let page='dashboard',term='',filter='All',edit=null,liveReady=false,liveError='';
async function loadLiveData(){
  liveError='';
  try{
    const entries=Object.entries(LIVE_TYPES);
    const results=await Promise.all(entries.map(([,cfg])=>api(cfg.path)));
    entries.forEach(([type,cfg],i)=>{
      const payload=results[i][cfg.key]||[];
      data[type]=payload.map(cfg.map);
    });
    liveReady=true;
    try{localStorage.setItem(KEY,JSON.stringify({...data}))}catch(e){}
  }catch(err){
    liveReady=false;
    liveError=err.message||String(err);
    console.error('Failed to load portal data', err);
  }
  render();
}
const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const dollar=x=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(x)||0);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){console.warn('Local storage unavailable',e)}};const el=(s)=>document.getElementById(s);const buttons=(labels)=>labels.map(x=>`<button class="btn ${x.cls||''}" data-command="${esc(x.cmd)}">${x.text}</button>`).join('');const heading=(tag,title,desc,extra='')=>`<div class="head"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div><div class="head-actions">${extra}</div></div>`;const notice=()=>`<div class="demo"><strong>${liveReady?'LIVE SUPABASE DATA':(liveError?'SUPABASE API ERROR':'CONNECTING TO SUPABASE…')}</strong> ${liveReady?'Inquiries, Customers, Projects, Invoices, and Hosting all load from your Supabase database.':' '+(liveError?esc(liveError):'Fetching the latest records…')}</div>`;
const badge=s=>{let cl=/paid|active|completed|converted/i.test(s)?'green':/new|unpaid|overdue/i.test(s)?'orange':/progress|review|development|contacted/i.test(s)?'blue':'';return `<span class="status ${cl}">${esc(s)}</span>`};
const rows=(type)=>data[type].filter(x=>(filter==='All'||x.status===filter)&&Object.values(x).some(v=>String(v).toLowerCase().includes(term.toLowerCase())));
const statuses={inquiries:['New','Contacted','Proposal Sent','Converted','Closed'],customers:['Prospect','Active','Completed','Archived'],projects:['Not Started','In Development','Customer Review','Completed','On Hold'],invoices:['Draft','Sent','Unpaid','Paid','Overdue','Cancelled'],hosting:['Active','Renewal Due','Expired','Cancelled']};const pageTitles={inquiries:['INBOX / SALES','Customer Inquiries','Every new conversation in one organized place.'],customers:['CRM','Customer Directory','An individual record for every StorySites customer.'],projects:['DELIVERY','Project Pipeline','Track each StorySite from kickoff through delivery.'],invoices:['FINANCE','Invoices & Payments','Manage invoice records and track outstanding balances.'],hosting:['RECURRING SERVICES','Hosting & Renewals','Keep customer hosting and upcoming renewals visible.']};
function renderDashboard(){const open=data.inquiries.filter(x=>x.status==='New').length,active=data.projects.filter(x=>x.status!=='Completed'&&x.status!=='On Hold').length,outstanding=data.invoices.filter(x=>!['Paid','Cancelled'].includes(x.status)).reduce((n,x)=>n+Number(x.amount||0),0);const ps=statuses.projects.map(s=>({name:s,num:data.projects.filter(x=>x.status===s).length}));const max=Math.max(1,...ps.map(x=>x.num));const activity=[...data.inquiries.map(x=>({name:x.name,title:'Inquiry · '+x.service,date:x.date||'',type:'inquiry'})),...data.projects.map(x=>({name:x.name,title:'Project · '+x.status,date:x.due||'',type:'project'}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
return heading('YOUR STORYSITES BUSINESS','Good morning, StorySites.','A clear view of your customer activity, active work, and next steps.',buttons([{text:'＋ New inquiry',cmd:'add:inquiries',cls:'orange'},{text:'＋ New customer',cmd:'add:customers'}]))+notice()+`<section class="stats"><div class="stat"><div class="sttop">New inquiries <span>✉</span></div><div class="num">${open}</div><div class="desc">Awaiting first response</div></div><div class="stat"><div class="sttop">Active projects <span>▦</span></div><div class="num">${active}</div><div class="desc">StorySites in production</div></div><div class="stat"><div class="sttop">Customers <span>♧</span></div><div class="num">${data.customers.length}</div><div class="desc">Records in your directory</div></div><div class="stat"><div class="sttop">Outstanding invoices <span>＄</span></div><div class="num" style="font-size:29px">${dollar(outstanding)}</div><div class="desc">Outstanding balances</div></div></section><div class="cols"><div><div class="panel"><div class="panelhead"><h2>Project pipeline</h2><button class="smalllink" data-command="go:projects">View projects →</button></div>${ps.map(x=>`<div class="barrow"><span>${esc(x.name)}</span><div class="bartrack"><div class="barfill" style="width:${100*x.num/max}%"></div></div><strong>${x.num}</strong></div>`).join('')}</div><div class="panel"><div class="panelhead"><h2>Current projects</h2><button class="smalllink" data-command="go:projects">Manage →</button></div>${table('projects',data.projects.slice(0,4),true)}</div></div><div><div class="panel"><div class="panelhead"><h2>Priority actions</h2></div><div class="activity"><div class="activityitem"><span class="dot"></span><div><b>${open} inquiries awaiting attention</b><span>Review messages and follow up with prospective customers.</span><button class="actionlink" data-command="go:inquiries">Open inquiries →</button></div></div><div class="activityitem"><span class="dot" style="background:#3772b7"></span><div><b>${active} projects in progress</b><span>Update project stages as work advances.</span><button class="actionlink" data-command="go:projects">Manage projects →</button></div></div><div class="activityitem"><span class="dot" style="background:#20956b"></span><div><b>${data.hosting.length} hosting records</b><span>Review upcoming renewal dates and account status.</span><button class="actionlink" data-command="go:hosting">View hosting →</button></div></div></div></div><div class="panel"><div class="panelhead"><h2>Recent activity</h2></div>${activity.map(x=>`<div class="activityitem"><span class="dot" style="background:#c7c9cd"></span><div><b>${esc(x.name)}</b><span>${esc(x.title)} · ${esc(x.date)}</span></div></div>`).join('')||'<p class="privacy">No recent activity.</p>'}</div></div></div>`}
const cols={inquiries:[['name','Prospect'],['service','Interest'],['date','Received'],['status','Stage']],customers:[['name','Customer'],['service','Service'],['email','Email'],['status','Status']],projects:[['name','Customer'],['service','Project type'],['due','Target date'],['status','Stage']],invoices:[['name','Customer'],['amount','Amount'],['due','Due date'],['status','Payment']],hosting:[['name','Customer'],['site','Hosted site'],['renewal','Renewal'],['status','Status']]};
function table(type,items,compact=false){const fields=cols[type];return `<div class="tablewrap"><table class="datatable"><thead><tr>${fields.map(x=>`<th>${x[1]}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${items.map(x=>`<tr>${fields.map(([key])=>`<td>${key==='name'?`<strong>${esc(x.name)}</strong><em>${esc(x.id)}</em>`:key==='status'?compact?badge(x.status):`<select class="mini-select" aria-label="Status for ${esc(x.name)}" data-status-type="${type}" data-status-id="${esc(x.id)}">${statuses[type].map(st=>`<option ${st===x.status?'selected':''}>${esc(st)}</option>`).join('')}</select>`:key==='amount'?`<strong class="money">${dollar(x.amount)}</strong>`:esc(x[key])}</td>`).join('')}<td><button class="actionlink" data-command="edit:${type}:${esc(x.id)}">Edit</button> ${type==='invoices'&&!/paid|cancelled/i.test(x.status)?`<button class="actionlink" data-command="pay:invoices:${esc(x.id)}">Collect payment</button> `:''}<button class="actionlink red" data-command="delete:${type}:${esc(x.id)}">Delete</button></td></tr>`).join('')}</tbody></table>${items.length?'':'<div class="empty">No matching records. Try a different search or add a record.</div>'}</div>`}
function renderList(type){const [tag,title,desc]=pageTitles[type];const items=rows(type);return heading(tag,title,desc,buttons([{text:'＋ Add '+({inquiries:'inquiry',customers:'customer',projects:'project',invoices:'invoice',hosting:'hosting record'}[type]),cmd:'add:'+type,cls:'orange'}]))+notice()+`<div class="panel"><div class="tools"><input class="search" id="search" type="search" value="${esc(term)}" placeholder="Search names, emails, details..." aria-label="Search records"><select class="filter" id="filter" aria-label="Filter by status"><option>All</option>${statuses[type].map(s=>`<option ${s===filter?'selected':''}>${esc(s)}</option>`).join('')}</select><button class="btn" data-command="resetfilters">Clear filters</button></div><div id="tablehere">${table(type,items)}</div></div><div class="note"><b>Connected to Supabase + Stripe:</b> Contact-form submissions fill the operational tabs. On Invoices, use <b>Collect payment</b> to open Stripe Checkout; webhooks mark the invoice Paid.</div>`}
function renderSetup(){return heading('THE ROAD TO LAUNCH','Platform Setup','Build the secure system behind this management interface.',buttons([{text:'↓ Export sample data',cmd:'export'}]))+notice()+`<div class="cols"><div class="panel"><div class="panelhead"><h2>Production implementation plan</h2></div>${[['Public website & inquiry capture','Deploy the StorySites marketing website to Netlify, configure form notifications, and verify live inquiry submissions.'],['Database & customer records','Create Supabase tables for inquiries, customers, projects, invoices, hosting and activity. Define relations, validation and backups.'],['Authentication & authorization','Protect this separate private portal with sign-in, role-based access, and database row-level security. Never expose customer data through browser-only security.'],['Connected workflow','Send approved Netlify submissions to the database using validated server-side functions, with duplicate checks and spam protection.'],['Ordering & billing','Stripe Checkout is live via Collect payment on invoices. Configure STRIPE_SECRET_KEY + STRIPE_WEBHOOK_SECRET on storysite-entry and point a Stripe webhook to /api/stripe-webhook.'],['Production checks','Test permissions, forms, email notifications, mobile experience, exports, backups and recovery before storing customer information.']].map((x,i)=>`<div class="setupstep"><div class="stepnum">${i+1}</div><div><strong>${x[0]}</strong><p>${x[1]}</p></div></div>`).join('')}</div><div><div class="panel"><div class="panelhead"><h2>Suggested architecture</h2></div><div class="note"><b>Public StorySites</b><br>Netlify — marketing, portfolio, inquiry and order request forms<br><br><b>Private Management Portal</b><br>Separate Netlify site — authenticated staff access<br><br><b>Persistent customer data</b><br>Supabase Postgres + Auth + row-level security<br><br><b>Server-side integration</b><br>Netlify Functions — validated requests and Stripe webhooks<br><br><b>Billing</b><br>Stripe — checkout and hosted invoices</div></div><div class="panel"><div class="panelhead"><h2>Local prototype controls</h2></div><p class="privacy">Inquiries, customers, projects, invoices, and hosting load from Supabase. Use Reload to refresh from the database. Export still downloads a JSON snapshot of the current view.</p><button class="btn danger" data-command="reset">↺ Reload from Supabase</button></div></div></div>`}
function render(){el('app').innerHTML=page==='dashboard'?renderDashboard():page==='setup'?renderSetup():renderList(page);document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));el('navinq').textContent=data.inquiries.filter(x=>x.status==='New').length;const s=el('search');if(s)s.addEventListener('input',e=>{term=e.target.value;el('tablehere').innerHTML=table(page,rows(page))});const f=el('filter');if(f)f.addEventListener('change',e=>{filter=e.target.value;el('tablehere').innerHTML=table(page,rows(page))})}
const specs={inquiries:[['name','Name','text',true],['email','Email address','email',true],['service','Interested in','select:service',true],['status','Stage','select:status',true],['date','Date received','date',true],['notes','Notes','textarea',false]],customers:[['name','Customer name','text',true],['email','Email address','email',true],['service','Service','select:service',true],['status','Status','select:status',true],['notes','Customer notes','textarea',false]],projects:[['name','Customer name','text',true],['service','Service','select:service',true],['status','Stage','select:status',true],['due','Target completion','date',true],['notes','Project notes','textarea',false]],invoices:[['name','Customer name','text',true],['amount','Invoice amount ($)','number',true],['status','Payment status','select:status',true],['due','Due date','date',true],['notes','Invoice notes','textarea',false]],hosting:[['name','Customer name','text',true],['site','Site URL or domain','text',true],['renewal','Renewal date','date',true],['status','Hosting status','select:status',true],['notes','Hosting notes','textarea',false]]};const services=['Personal StorySite','Executive StorySite','Business StorySite','Creative StorySite','Custom StorySite'];
function openForm(type,id){edit={type,id};const record=id?data[type].find(x=>x.id===id):null;const fields=specs[type];el('modalcontent').innerHTML=`<div class="eyebrow">STORYSITES / ${id?'EDIT':'NEW'} RECORD</div><h2 id="modaltitle">${id?'Edit':'Add'} ${type==='hosting'?'hosting record':type.slice(0,-1)}</h2><p>Records save to Supabase. Use real operational data carefully.</p><div class="formgrid">${fields.map(([key,label,kind,required])=>`<div class="field" style="${kind==='textarea'?'grid-column:1/-1':''}"><label for="fld_${key}">${label}</label>${kind==='textarea'?`<textarea id="fld_${key}" name="${key}" ${required?'required':''}>${esc(record?.[key]||'')}</textarea>`:kind.startsWith('select:')?`<select id="fld_${key}" name="${key}" ${required?'required':''}>${(kind==='select:status'?statuses[type]:services).map(s=>`<option ${s===(record?.[key]||'')?'selected':''}>${esc(s)}</option>`).join('')}</select>`:`<input id="fld_${key}" name="${key}" type="${kind}" ${required?'required':''} ${kind==='number'?'min="0" step="0.01"':''} value="${esc(record?.[key]??(kind==='date'?today():''))}">`}</div>`).join('')}</div>`;el('modaloverlay').classList.add('show');const first=el('modalcontent').querySelector('input,select');if(first)first.focus()}
function closeModal(){el('modaloverlay').classList.remove('show');edit=null}
function exportData(){const blob=new Blob([JSON.stringify({metadata:{prototype:true,exportedAt:new Date().toISOString()},records:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='StorySites_Portal_Demo_Export.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function collectStripePayment(id){
  const inv=data.invoices.find(x=>x.id===id);
  if(!inv){alert('Invoice not found');return}
  if(/paid|cancelled/i.test(inv.status)){alert('This invoice cannot be charged.');return}
  const customer=data.customers.find(c=>String(c.id)===String(inv.customer_id)||c.name===inv.name);
  try{
    const result=await api('/api/create-checkout-session',{method:'POST',body:JSON.stringify({invoice_id:id,email:customer?.email||undefined})});
    if(!result.url) throw new Error('No Checkout URL returned');
    inv.status='Sent';
    save();
    render();
    window.open(result.url,'_blank','noopener,noreferrer');
  }catch(err){
    alert('Could not start Stripe Checkout: '+(err.message||err));
  }
}
function command(c){const [act,type,id]=c.split(':');if(act==='go'){page=type;term='';filter='All';render();window.scrollTo(0,0)}else if(act==='add'||act==='edit')openForm(type,id);else if(act==='delete'){const live=!!LIVE_TYPES[type];if(confirm(live?'Delete this record from Supabase?':'Delete this sample record?')){const item=data[type].find(x=>x.id===id);const finish=()=>{data[type]=data[type].filter(x=>x.id!==id);save();render()};if(live&&item&&item.source==='supabase'){api(LIVE_TYPES[type].path+'/'+encodeURIComponent(id),{method:'DELETE'}).then(finish).catch(err=>alert('Could not delete: '+(err.message||err)));}else finish();}}else if(act==='pay'&&type==='invoices'){collectStripePayment(id)}else if(act==='resetfilters'){term='';filter='All';render()}else if(act==='export')exportData();else if(act==='reset'){if(confirm('Reload all records from Supabase? Local-only changes will be discarded.')){loadLiveData()}}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){page=nav.dataset.page;term='';filter='All';render();el('sidebar').classList.remove('open');window.scrollTo(0,0);return}const cmd=e.target.closest('[data-command]');if(cmd)command(cmd.dataset.command)});document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-status-type]')){const item=data[t.dataset.statusType].find(x=>x.id===t.dataset.statusId);if(item){const prev=item.status;item.status=t.value;save();if(item.source==='supabase'&&LIVE_TYPES[t.dataset.statusType]){api(LIVE_TYPES[t.dataset.statusType].path+'/'+encodeURIComponent(item.id),{method:'PATCH',body:JSON.stringify({status:t.value})}).catch(err=>{item.status=prev;save();alert('Could not update status: '+(err.message||err));render();});}const keep=document.activeElement===t;render();if(keep){const next=document.querySelector(`[data-status-id="${CSS.escape(t.dataset.statusId)}"]`);if(next)next.focus()}}}});el('entryform').addEventListener('submit',async e=>{e.preventDefault();if(!edit)return;const {type,id}=edit,form=new FormData(e.target);const payload={};for(const [k] of specs[type])payload[k]=form.get(k)||'';if(type==='invoices')payload.amount=Number(payload.amount)||0;const live=LIVE_TYPES[type];if(live){try{if(id){const result=await api(live.path+'/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(payload)});const mapped=live.map(result[live.singular]);Object.assign(data[type].find(x=>x.id===id)||{},mapped,{source:'supabase'});}else{const result=await api(live.path,{method:'POST',body:JSON.stringify(payload)});data[type].unshift(live.map(result[live.singular]));}save();closeModal();render()}catch(err){alert('Could not save '+live.singular+': '+(err.message||err))}return}const record=id?data[type].find(x=>x.id===id):{id:({inquiries:'I',customers:'C',projects:'P',invoices:'INV',hosting:'H'}[type])+'-'+Date.now().toString(36).toUpperCase()};for(const [k] of specs[type])record[k]=payload[k];if(type==='invoices')record.amount=payload.amount;if(!id)data[type].unshift(record);save();closeModal();render()});el('cancelmodal').addEventListener('click',closeModal);el('modaloverlay').addEventListener('click',e=>{if(e.target===el('modaloverlay'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});el('mobilemenu').addEventListener('click',()=>el('sidebar').classList.toggle('open'));el('exportbtn').addEventListener('click',exportData);loadLiveData();})();
</script></body></html>
