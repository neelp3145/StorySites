<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Payment received — StorySites</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(160deg, #f7f4ef, #efe7dc 45%, #f8f1ea);
      color: #1c1f24;
      padding: 24px;
    }
    .card {
      max-width: 520px;
      background: #fff;
      border: 1px solid #e6dfd4;
      padding: 40px 36px;
      box-shadow: 0 18px 50px rgba(40, 28, 16, 0.08);
    }
    .eyebrow {
      font-family: system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #c45a38;
      font-weight: 700;
      margin-bottom: 12px;
    }
    h1 {
      font-size: clamp(32px, 5vw, 44px);
      letter-spacing: -0.04em;
      line-height: 1.1;
      margin: 0 0 14px;
    }
    p {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #555b63;
      margin: 0 0 22px;
    }
    a {
      font-family: system-ui, sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ef6543;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
      padding: 12px 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">StorySites · Payment</div>
    <h1>Payment received.</h1>
    <p>
      Thank you. Your StorySite payment went through successfully. We’ll follow up
      with next steps for your project. You can close this window.
    </p>
    <a href="/">Back to StorySites</a>
  </div>
</body>
</html>
