[build]
  publish = "site"
  functions = "netlify/functions"
  command = "npm install"

# Secrets scanning: SUPABASE_URL is a public project URL (safe to omit).
# Function bundles may embed server-only env at build time; they are not
# client-facing static assets, so omit .netlify output from the scan.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"
  SECRETS_SCAN_OMIT_PATHS = ".netlify/**"

# Local marketing/test form: npm run test:dev
# Local management portal: npm run portal:dev
[dev]
  framework = "#static"
  publish = "test-site"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/inquiries"
  to = "/.netlify/functions/inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/inquiries"
  to = "/.netlify/functions/admin-inquiries"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/inquiries/:id"
  to = "/.netlify/functions/admin-inquiries?id=:id"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/customers"
  to = "/.netlify/functions/admin-customers"
  status = 200
  force = true

[[redirects]]
  from = "/api/admin/customers/:id"
  to = "/.netlify/functions/admin-customers?id=:id"
  status = 200
  force = true
